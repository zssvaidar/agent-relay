kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-relay
nodes:
  - role: control-plane
    # NodePort 30080 on the cluster -> http://localhost:8000 on the host.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
